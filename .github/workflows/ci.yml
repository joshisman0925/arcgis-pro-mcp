name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.action == 'edited' && github.event.changes.base == null && format('ci-edit-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null)) }}
    uses: singi0771/ci-standards/.github/workflows/ci-reusable.yml@v2
    with:
      run-python: false
      run-docker-build: false
      run-hadolint: false
      run-actionlint: true
      run-shellcheck: false
      python-version: "3.12"
      # ArcGIS Pro add-in references DLLs under C:\Program Files\ArcGIS\Pro; hosted runners cannot build it.
      # The connector job below covers the TypeScript side; the add-in is built locally.
      run-dotnet: false
  connector:
    name: Connector tests
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null)) }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify packaged DLL does not contain local build paths
        shell: pwsh
        run: ./scripts/check-package-privacy.ps1
      - name: Protocol and tool tests (mock Pro)
        run: npm test
      - name: Isolated bundled plugin test
        run: npm run test:plugin

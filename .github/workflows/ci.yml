name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: singi0771/ci-standards/.github/workflows/ci-reusable.yml@v1
    with:
      run-python: false
      run-docker-build: false
      run-hadolint: false
      run-actionlint: true
      run-shellcheck: false
  connector:
    name: Connector tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      # Hosted runners often take over 30 seconds for the first Windows PowerShell 5.1
      # start. Warm it once so list_sessions tests measure the connector, not image cold start.
      - name: Warm up Windows PowerShell
        shell: pwsh
        run: |
          # Same cmdlets as server.mjs listSessions, so first-use module loading is warmed too.
          $probe = "`$ErrorActionPreference='Stop'; [Console]::OutputEncoding = [Text.UTF8Encoding]::new(`$false); `$items = @(Get-Process -Name ArcGISPro -ErrorAction SilentlyContinue | Select-Object @{Name='processId';Expression={`$_.Id}},@{Name='title';Expression={`$_.MainWindowTitle}}); ConvertTo-Json -InputObject `$items -Compress"
          foreach ($attempt in 1..2) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            powershell.exe -NoProfile -NonInteractive -Command $probe | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell warm-up failed ($LASTEXITCODE)." }
            Write-Output "Windows PowerShell session probe $attempt took $([int]$sw.Elapsed.TotalMilliseconds) ms."
          }
      - name: Verify packaged DLL does not contain local build paths
        shell: pwsh
        run: ./scripts/check-package-privacy.ps1
      - name: Protocol and tool tests (mock Pro)
        run: npm test
      - name: Isolated bundled plugin test
        run: npm run test:plugin

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: singi0771/ci-standards/.github/workflows/ci-reusable.yml@v1
    with:
      run-python: false
      run-docker-build: false
      run-hadolint: false
      run-actionlint: true
      run-shellcheck: false
  connector:
    name: Connector tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Protocol and tool tests (mock Pro)
        run: npm test
      - name: Isolated bundled plugin test
        run: npm run test:plugin
      - name: Verify packaged DLL does not contain local build paths
        shell: pwsh
        run: ./scripts/check-package-privacy.ps1
